# kirkus updates
#
# Weekly automatic updates: once a week (when plugged in and not on a metered connection), the
# system is updated with pacman -Syu and Flatpak apps are updated. If Arch has posted news since
# your last update, you're asked to read it and update by hand instead.
# Set to no to turn this off, or use System Settings > Automatic Updates, or: sudo kirk-auto-update off
AUTO_SYSTEM_UPDATE=yes

# kirkus releases:
# After every `sudo pacman -Syu` that upgrades something, kirkus checks GitHub for a newer published
# release and, if there is one, applies it in the background with apply-to-installed.sh.
# Only published releases are used, never unreleased work on the main branch.
#
# Set to no to turn this off. You can still update by hand with: sudo kirk-update
AUTO_UPDATE=yes

# Where releases come from
REPO=goseahawk/kirkus
